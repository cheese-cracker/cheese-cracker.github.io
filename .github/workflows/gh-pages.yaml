name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:
  workflow_dispatch:

# Required by actions/deploy-pages: OIDC token + write access to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned on purpose: 'latest' silently adopts each new Hugo release,
          # which is how deprecations broke this site before.
          hugo-version: '0.165.0'
          extended: true

      - name: Build
        run: hugo --gc --minify --environment production

      # PaperMod emits noindex + 'Disallow: /' outside production. If that ever
      # ships, the site vanishes from search with no visible symptom.
      - name: Assert the build is indexable
        run: |
          grep -q 'Disallow: *$' public/robots.txt \
            || { echo "::error::robots.txt is not indexable"; cat public/robots.txt; exit 1; }
          ! grep -qi 'name=.robots. content=.noindex' public/index.html \
            || { echo "::error::home page carries noindex"; exit 1; }
          test -s public/sitemap.xml && test -s public/llms.txt
          echo "indexable: robots.txt, sitemap.xml and llms.txt all present"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
